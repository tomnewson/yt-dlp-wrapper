[package]
name = "yt-dlp-wrapper"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A minimal Windows-first GUI for yt-dlp"

[dependencies]
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-software"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate", "deflate64", "lzma", "xz"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1.17"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
