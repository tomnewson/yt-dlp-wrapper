name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine build version
        id: build-version
        shell: pwsh
        run: |
          $version = (git describe --tags --abbrev=0 --match "v[0-9]*").Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Build version $version is not a supported semantic version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Restore .NET packages
        run: dotnet restore YtDlpWrapper.slnx

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets --target x86_64-pc-windows-msvc --locked

      - name: Check .NET formatting
        run: dotnet format YtDlpWrapper.slnx --verify-no-changes --no-restore

      - name: Run .NET tests
        run: dotnet test YtDlpWrapper.slnx --no-restore -m:1 --disable-build-servers -warnaserror

      - name: Build Rust backend
        env:
          YT_DLP_WRAPPER_VERSION: ${{ steps.build-version.outputs.version }}
        run: cargo build --release --target x86_64-pc-windows-msvc --locked

      - name: Publish Avalonia frontend
        run: >-
          dotnet publish src/dotnet/YtDlpWrapper.App/YtDlpWrapper.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:Version=${{ steps.build-version.outputs.version }}
          --output dist/yt-dlp-wrapper

      - name: Assemble portable application
        shell: pwsh
        run: |
          Remove-Item dist/yt-dlp-wrapper/*.pdb -ErrorAction SilentlyContinue
          Copy-Item target/x86_64-pc-windows-msvc/release/yt-dlp-wrapper-backend.exe dist/yt-dlp-wrapper/
          Copy-Item COPYING,README.md,THIRD_PARTY.md dist/yt-dlp-wrapper/

      - name: Smoke-test backend protocol
        shell: pwsh
        run: ./scripts/backend-smoke.ps1 dist/yt-dlp-wrapper/yt-dlp-wrapper-backend.exe

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/yt-dlp-wrapper -DestinationPath dist/yt-dlp-wrapper-windows-x64.zip

      - name: Install Velopack CLI
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download previous Velopack release for delta generation
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --outputDir dist/velopack

      - name: Build installer and update packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          vpk pack
          --packId yt-dlp-wrapper
          --packVersion ${{ steps.build-version.outputs.version }}
          --packDir dist/yt-dlp-wrapper
          --mainExe yt-dlp-wrapper.exe
          --packTitle "YT-DLP Wrapper"
          --packAuthors "Tom Newson"
          --runtime win-x64
          --outputDir dist/velopack

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ steps.build-version.outputs.version }}'
          New-Item -ItemType Directory -Force dist/release-assets | Out-Null
          Copy-Item dist/velopack/releases.win.json dist/release-assets/
          Copy-Item "dist/velopack/yt-dlp-wrapper-$version-full.nupkg" dist/release-assets/
          Copy-Item "dist/velopack/yt-dlp-wrapper-$version-delta.nupkg" dist/release-assets/ -ErrorAction SilentlyContinue
          Copy-Item dist/velopack/*-Setup.exe dist/release-assets/YT-DLP-Wrapper-Installer.exe
          Copy-Item dist/velopack/*-Portable.zip dist/release-assets/YT-DLP-Wrapper-Portable.zip

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-wrapper-windows-x64
          path: dist/yt-dlp-wrapper-windows-x64.zip
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-wrapper-release-assets
          path: dist/release-assets/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer and update packages
        uses: actions/download-artifact@v4
        with:
          name: yt-dlp-wrapper-release-assets
          path: dist/release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          download_notes=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            '<!-- user-downloads -->' \
            '## Download for Windows' \
            "**Most users:** [Download the Windows installer]($download_base/YT-DLP-Wrapper-Installer.exe) and run it." \
            "**Portable use:** [Download the portable ZIP]($download_base/YT-DLP-Wrapper-Portable.zip), extract it, and run the app without installing it." \
            'The other files are used by automatic updates or contain the source code.')

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

            current_notes=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [[ "$current_notes" != *'<!-- user-downloads -->'* ]]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$download_notes"$'\n\n'"$current_notes"
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/release-assets/* --generate-notes --notes "$download_notes" --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
