name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Restore .NET packages
        run: dotnet restore YtDlpWrapper.slnx

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets --target x86_64-pc-windows-msvc --locked

      - name: Check .NET formatting
        run: dotnet format YtDlpWrapper.slnx --verify-no-changes --no-restore

      - name: Run .NET tests
        run: dotnet test YtDlpWrapper.slnx --no-restore -m:1 --disable-build-servers

      - name: Build Rust backend
        run: cargo build --release --target x86_64-pc-windows-msvc --locked

      - name: Publish Avalonia frontend
        run: >-
          dotnet publish src/dotnet/YtDlpWrapper.App/YtDlpWrapper.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          --output dist/yt-dlp-wrapper

      - name: Assemble portable application
        shell: pwsh
        run: |
          Remove-Item dist/yt-dlp-wrapper/*.pdb -ErrorAction SilentlyContinue
          Copy-Item target/x86_64-pc-windows-msvc/release/yt-dlp-wrapper-backend.exe dist/yt-dlp-wrapper/
          Copy-Item COPYING,README.md,THIRD_PARTY.md dist/yt-dlp-wrapper/

      - name: Smoke-test backend protocol
        shell: pwsh
        run: ./scripts/backend-smoke.ps1 dist/yt-dlp-wrapper/yt-dlp-wrapper-backend.exe

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/yt-dlp-wrapper -DestinationPath dist/yt-dlp-wrapper-windows-x64.zip

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-wrapper-windows-x64
          path: dist/yt-dlp-wrapper-windows-x64.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: yt-dlp-wrapper-windows-x64
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/yt-dlp-wrapper-windows-x64.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/yt-dlp-wrapper-windows-x64.zip --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
