name: macOS ARM64

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Select Xcode 26.5
        run: |
          xcode_path=/Applications/Xcode_26.5.app/Contents/Developer
          test -d "$xcode_path"
          echo "DEVELOPER_DIR=$xcode_path" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode_path" xcodebuild -version

      - name: Test Rust backend and engine
        run: cargo test --all-targets --locked

      - name: Check Rust formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Restore .NET packages
        run: dotnet restore YtDlpWrapper.slnx

      - name: Test platform-neutral .NET projects
        run: dotnet test YtDlpWrapper.slnx --no-restore -m:1 --disable-build-servers -warnaserror

      - name: Build macOS ARM64 application bundle
        run: ./scripts/build-macos-arm64.sh

      - name: Verify native executables and backend protocol
        run: |
          app='dist/macos-arm64/YT-DLP Wrapper.app/Contents/MacOS'
          test "$(lipo -archs "$app/yt-dlp-wrapper")" = "arm64"
          test "$(lipo -archs "$app/yt-dlp-wrapper-backend")" = "arm64"
          ./scripts/backend-smoke.sh "$app/yt-dlp-wrapper-backend"
          test -f 'dist/macos-arm64/YT-DLP Wrapper.app/Contents/Resources/Assets.car'
          codesign --verify --deep --strict 'dist/macos-arm64/YT-DLP Wrapper.app'

      - name: Upload macOS ARM64 application
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-wrapper-macos-arm64
          path: dist/macos-arm64/YT-DLP-Wrapper-macOS-arm64.zip
          if-no-files-found: error
