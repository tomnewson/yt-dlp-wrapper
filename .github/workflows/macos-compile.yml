name: macOS ARM64 compile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Test Rust backend and engine
        run: cargo test --all-targets --locked

      - name: Restore .NET packages
        run: dotnet restore YtDlpWrapper.slnx

      - name: Test platform-neutral .NET projects
        run: dotnet test YtDlpWrapper.slnx --no-restore -m:1 --disable-build-servers -warnaserror

      - name: Compile future macOS ARM64 frontend
        run: >-
          dotnet publish src/dotnet/YtDlpWrapper.App/YtDlpWrapper.App.csproj
          --configuration Release
          --runtime osx-arm64
          --self-contained true
          --no-restore
          -p:PublishTrimmed=false
          --output dist/macos-arm64-compile-only
